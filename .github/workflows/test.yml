name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node.js LTS lines supported upstream (see https://nodejs.org/en/about/previous-releases)
        node-version: [22.x, 24.x, 26.x]
        # dates depend on the host timezone: run on UTC, on a zone with DST/LMT history and on one that skipped a day (date line)
        tz: [UTC, America/Sao_Paulo, Pacific/Apia]
    name: test (node ${{ matrix.node-version }}, TZ ${{ matrix.tz }})
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
